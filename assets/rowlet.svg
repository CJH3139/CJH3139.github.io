<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Owl illustration">
  <defs>
    <radialGradient id="bodyG" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#b08d68"/>
      <stop offset="100%" stop-color="#8a6a4b"/>
    </radialGradient>
    <radialGradient id="faceG" cx="45%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#efe4cd"/>
    </radialGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3d977"/>
      <stop offset="100%" stop-color="#6fae43"/>
    </linearGradient>
  </defs>

  <!-- feet -->
  <g fill="#e0a45c">
    <ellipse cx="163" cy="356" rx="23" ry="10"/>
    <ellipse cx="237" cy="356" rx="23" ry="10"/>
  </g>

  <!-- tail -->
  <path d="M200 330 q-30 34 -6 52 q6 -22 6 -30 q0 8 6 30 q24 -18 -6 -52 z" fill="#7d5f42"/>

  <!-- wings -->
  <ellipse cx="74" cy="236" rx="40" ry="80" fill="#846446" transform="rotate(-9 74 236)"/>
  <ellipse cx="326" cy="236" rx="40" ry="80" fill="#846446" transform="rotate(9 326 236)"/>

  <!-- body -->
  <ellipse cx="200" cy="214" rx="150" ry="146" fill="url(#bodyG)"/>

  <!-- face disc -->
  <ellipse cx="200" cy="178" rx="119" ry="104" fill="url(#faceG)"/>

  <!-- brow feathers -->
  <path d="M104 128 q34 -30 74 -16 q-38 4 -74 16 z" fill="#8a6a4b" opacity=".55"/>
  <path d="M296 128 q-34 -30 -74 -16 q38 4 74 16 z" fill="#8a6a4b" opacity=".55"/>

  <!-- eyes -->
  <circle cx="152" cy="176" r="31" fill="#20201e"/>
  <circle cx="248" cy="176" r="31" fill="#20201e"/>
  <circle cx="142" cy="165" r="10" fill="#ffffff"/>
  <circle cx="238" cy="165" r="10" fill="#ffffff"/>
  <circle cx="161" cy="188" r="4.5" fill="#ffffff" opacity=".65"/>
  <circle cx="257" cy="188" r="4.5" fill="#ffffff" opacity=".65"/>

  <!-- beak -->
  <path d="M200 198 l17 18 q-17 13 -34 0 z" fill="#e8a85b"/>
  <path d="M200 198 l17 18 q-8 6 -17 6 z" fill="#d3924a"/>

  <!-- leaf bow tie -->
  <g>
    <path d="M188 296 c-26 -20 -62 -18 -76 4 c22 20 58 18 76 -4 z" fill="url(#leafG)"/>
    <path d="M212 296 c26 -20 62 -18 76 4 c-22 20 -58 18 -76 -4 z" fill="url(#leafG)"/>
    <path d="M112 300 q38 -4 76 -4" stroke="#5c9636" stroke-width="2.5" fill="none" opacity=".7"/>
    <path d="M288 300 q-38 -4 -76 -4" stroke="#5c9636" stroke-width="2.5" fill="none" opacity=".7"/>
    <circle cx="200" cy="295" r="13" fill="#6fae43"/>
    <circle cx="196" cy="291" r="4" fill="#a3d977" opacity=".8"/>
  </g>
</svg>
