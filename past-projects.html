<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Projects | CJH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #38bdf8;
      --bg: #080c14;
      --border: rgba(56,189,248,0.12);
      --text: #e8edf3;
      --muted: #64748b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    /* pixel grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .wrap { position: relative; z-index: 1; }

    .eyebrow {
      font-family: 'VT323', monospace;
      font-size: 0.9rem;
      color: var(--blue);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      background: var(--blue);
      color: #000;
      border-bottom: 3px solid #0284c7;
      padding: 11px 22px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    a:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(56,189,248,0.25);
    }
  </style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">// archive</p>
  <h1>Past Projects</h1>
  <p>Nothing here yet. This page is under construction.</p>
  <a href="index.html">← Back to home</a>
</div>

</body>
</html>
